name: dallas-transit

services:
  postgres:
    image: postgis/postgis:18-3.6
    # Upstream PostGIS publishes amd64 images; ARM hosts need Docker emulation.
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dallas_transit}
      POSTGRES_USER: ${POSTGRES_USER:-dallas_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_password}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:8.10.1-alpine
    # Realtime/cache state is deliberately ephemeral (ADR 0004).
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:
